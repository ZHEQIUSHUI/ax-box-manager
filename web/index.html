<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login-wrap" hidden>
  <div class="panel login">
    <h1 data-i18n="login.title"></h1>
    <p class="sub" id="login-host"></p>
    <form id="login-form">
      <label class="field"><span data-i18n="login.user"></span>
        <input type="text" name="user" autocomplete="username" value="root" required></label>
      <label class="field"><span data-i18n="login.password"></span>
        <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <p class="err-text" id="login-error" hidden></p>
      <button class="btn primary" type="submit" data-i18n="login.submit"></button>
      <p class="hint" data-i18n="login.hint"></p>
    </form>
    <div class="btn-row" style="margin-top:12px"><span class="seg lang-seg"></span></div>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="device-name"><strong id="side-host"></strong><span id="side-chip"></span></div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-page="overview"><span data-i18n="nav.overview"></span></a>
      <a href="#/models" data-page="models"><span data-i18n="nav.models"></span><span class="count" id="nav-running"></span></a>
      <a href="#/playground" data-page="playground"><span data-i18n="nav.playground"></span></a>
      <a href="#/logs" data-page="logs"><span data-i18n="nav.logs"></span></a>
      <a href="#/settings" data-page="settings"><span data-i18n="nav.settings"></span></a>
    </nav>
    <div class="side-foot">
      <div class="row"><span class="seg lang-seg"></span></div>
      <div class="row"><span class="muted" id="side-user"></span><button class="btn small ghost" id="logout" data-i18n="nav.logout"></button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="confirm">
  <h3 id="confirm-title"></h3>
  <p id="confirm-text"></p>
  <div class="btn-row">
    <button class="btn" value="cancel" id="confirm-cancel" data-i18n="common.cancel"></button>
    <button class="btn primary" value="ok" id="confirm-ok"></button>
  </div>
</dialog>
<div id="toast" class="toast" hidden role="status"></div>
<script src="/app.js"></script>
</body>
</html>
